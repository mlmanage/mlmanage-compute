# Zestaw metryk dla dcgm-exportera BEZ pól profilujących (DCP).
#
# Domyślny plik GPU Operatora (/etc/dcgm-exporter/dcp-metrics-included.csv) żąda dodatkowo
# pól DCP: gr_engine_active, tensor_active, dram_active, pcie_tx_bytes, pcie_rx_bytes.
# Na części kombinacji sterownik/karta DCGM nie potrafi ich obserwować i dcgm-exporter
# przewraca się w pętli z:
#   "error watching fields: The third-party Profiling module returned an unrecoverable error"
#   "DCGM collector for entity type 'GPU' cannot be initialized"
# Skutek: BRAK jakichkolwiek metryk GPU w Prometheusie, a więc puste /analytics/usage,
# puste /gpu/usage i martwe alerty z monitoring/gpu-alerts.yaml.
#
# Poniższe liczniki są standardowe (nie-DCP) i wystarczają dla wszystkiego, co czyta backend:
#   DCGM_FI_DEV_GPU_UTIL / FB_USED / GPU_TEMP / POWER_USAGE  -> collect_gpu_metrics_once()
#   DCGM_FI_DEV_FB_FREE                                      -> alert GPUOOM
#   DCGM_FI_DEV_GPU_TEMP / POWER_USAGE                       -> alerty temperatury i mocy
#
# Włączane przez: helm --set dcgmExporter.config.name=dcgm-metrics (patrz scripts/deploy-all.sh).
apiVersion: v1
kind: ConfigMap
metadata:
  name: dcgm-metrics
  namespace: gpu-operator
data:
  dcgm-metrics.csv: |
    # Format: DCGM FIELD, Prometheus metric type, help message
    DCGM_FI_DEV_GPU_UTIL,                 gauge,   GPU utilization (in %).
    DCGM_FI_DEV_MEM_COPY_UTIL,            gauge,   Memory utilization (in %).
    DCGM_FI_DEV_FB_FREE,                  gauge,   Framebuffer memory free (in MiB).
    DCGM_FI_DEV_FB_USED,                  gauge,   Framebuffer memory used (in MiB).
    DCGM_FI_DEV_GPU_TEMP,                 gauge,   GPU temperature (in C).
    DCGM_FI_DEV_MEMORY_TEMP,              gauge,   Memory temperature (in C).
    DCGM_FI_DEV_POWER_USAGE,              gauge,   Power draw (in W).
    DCGM_FI_DEV_TOTAL_ENERGY_CONSUMPTION, counter, Total energy consumption since boot (in mJ).
    DCGM_FI_DEV_SM_CLOCK,                 gauge,   SM clock frequency (in MHz).
    DCGM_FI_DEV_MEM_CLOCK,                gauge,   Memory clock frequency (in MHz).
    DCGM_FI_DEV_XID_ERRORS,               gauge,   Value of the last XID error encountered.
